services:
  db:
    image: pgvector/pgvector:pg16
    container_name: agents_db
    environment:
      POSTGRES_USER: agents
      POSTGRES_PASSWORD: agents_dev
      POSTGRES_DB: agents
    ports:
      - "5433:5432"
    volumes:
      - agents_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agents"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agents_pgdata:
